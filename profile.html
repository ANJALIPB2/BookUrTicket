<!-- Unified User Profile Dashboard -->
        <section id="profile-view" class="view hidden" style="padding-top: 5rem; min-height: 80vh;">

            <div class="profile-header"
                style="background: white; padding: 3rem; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 3rem;">
                <div style="display: flex; align-items: center; gap: 2rem;">
                    <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--accent-color); color: white; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 800; position: relative; cursor: pointer; overflow: hidden; border: 2px solid #eee; transition: 0.3s;"
                        id="profile-avatar-container" onclick="document.getElementById('avatar-upload').click()">
                        <span id="profile-avatar-text" style="z-index: 1;">U</span>
                        <img id="profile-avatar-img" src="" alt="Avatar" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: none; z-index: 2;">
                        <input type="file" id="avatar-upload" accept="image/*" class="hidden">
                        <div style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: white; font-size: 0.6rem; text-align: center; padding: 3px 0; z-index: 3;">EDIT</div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <button id="delete-avatar-btn" class="btn btn-minimal hidden" 
                            style="padding: 0; color: #ff3366; font-size: 0.8rem; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">🗑️ Delete Photo</button>
                    </div>
                    <div>
                        <h1 id="profile-name" style="font-size: 2rem; margin-bottom: 0.2rem; color: #111;">User Name
                        </h1>
                        <p id="profile-email" style="color: #666; font-size: 1rem;">user@example.com</p>
                    </div>
                </div>
                <!-- Change Password Form -->
                <div class="change-password-box"
                    style="background: #fafafa; padding: 1.5rem; border-radius: 8px; border: 1px solid #eee; width: 300px;">
                    <h3 style="font-size: 1rem; margin-bottom: 1rem; color: #333;">🔒 Change Password</h3>
                    <div style="position: relative; margin-bottom: 0.8rem;">
                        <input type="password" id="new-password-input" placeholder="New Password"
                            style="width: 100%; padding: 0.6rem; padding-right: 2.5rem; border: 1px solid #ddd; border-radius: 4px; font-family: inherit;">
                        <button type="button" tabindex="-1" onclick="const p=document.getElementById('new-password-input'); p.type=p.type==='password'?'text':'password'; this.style.opacity=p.type==='password'?'0.5':'1';" style="position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1rem; padding: 0; opacity: 0.5;">👁️</button>
                    </div>
                    <button id="update-password-btn" class="btn btn-primary"
                        style="width: 100%; padding: 0.6rem; font-size: 0.9rem;">Update Securely</button>
                </div>
            </div>

            <div class="profile-collections">
                <h2 class="section-title"
                    style="text-align: left; border-bottom: 2px solid #eee; padding-bottom: 1rem; margin-bottom: 2rem;">
                    🎟️ Booking History</h2>
                <div id="dashboard-tickets" class="movies-grid" style="margin-bottom: 4rem;"></div>

                <h2 class="section-title"
                    style="text-align: left; border-bottom: 2px solid #eee; padding-bottom: 1rem; margin-bottom: 2rem;">
                    ❤️ My Wishlist</h2>
                <div id="wishlist-grid" class="movies-grid"></div>
            </div>

        </section>
